  details: |
    The program includes both short track and long track, and the skating location varies by time of year. Athletes train 1–2 times per week. Speed skates are required for Group 2.
  sessions:
    - track: Short Track
      when: Tuesday, 6:00–7:15 PM
      where: Kinsmen Arena
    - track: Long Track
      when: Tuesday & Thursday, 6:00–7:00 PM
      where: Victoria Oval
  fees:
    - label: Full season (Oct–Mar)
      price: $360
    - label: Half season (Oct–Dec or Jan–Mar)
      price: $190
  rental:
    - label: Full season (Oct–Mar)
      price: $150 + $100 refundable deposit
    - label: Half season (Oct–Dec or Jan–Mar)
      price: $75 + $100 refundable deposit


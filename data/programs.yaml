# Program options shown on the Programs page, in this order.
# Each program has:
#   group:    the group label shown in the badge (e.g. "1", "5", "6", or leave blank)
#   name:     program name
#   who:      who the program is for (Markdown allowed)
#   details:  extra details (Markdown allowed)
#   sessions: list of training times; track is "Short Track" or "Long Track"
#   fees:     program fees; rental: skate rental fees
#   note:     anything else (optional)

- group: "1"
  name: Group 1
  who: |
    Returning athletes who have been instructed to register in this program, **or** new athletes 5–8 years of age.
  details: |
    Skaters must be able to get up by themselves and propel themselves forward without assistance. The program includes both short track and long track, and the skating location varies by time of year. Athletes train 1–2 times per week.

    Speed skate rentals are not required for Group 1; hockey, figure or other skates can be used.
  sessions:
    - track: Short Track
      when: Tuesday, 5:15–6:00 PM
      where: Kinsmen Arena
    - track: Long Track
      when: Tuesday & Thursday, 6:00–7:00 PM
      where: Victoria Oval
  fees:
    - label: Full season (Oct–Mar)
      price: $305
    - label: Half season (Oct–Dec or Jan–Mar)
      price: $170
  rental:
    - label: Full season (Oct–Mar)
      price: $150 + $100 refundable deposit
    - label: Half season (Oct–Dec or Jan–Mar)
      price: $75 + $100 refundable deposit

